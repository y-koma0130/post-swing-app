name: Deploy

# 手動で動かす。GitHub の Environments（staging・production）に、次の秘密情報を入れておく
# - CLOUDFLARE_API_TOKEN: Workers・D1・R2・Queues を編集できる権限だけを付けたトークン
# - CLOUDFLARE_ACCOUNT_ID
# - D1_DATABASE_ID: その環境の D1 の ID（マイグレーションの適用に使う）
on:
  workflow_dispatch:
    inputs:
      environment:
        description: デプロイ先
        type: choice
        options: [staging, production]
        default: staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency: deploy-${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # 先にマイグレーションを当ててから、新しいコードを出す（列を足す変更は古いコードでも動くように書く）
      - run: pnpm db:migrate:remote
      - run: pnpm deploy:${{ inputs.environment }}
